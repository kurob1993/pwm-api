# For more information: https://laravel.com/docs/sail
services:
    app:
        image: 'kurob/tms:php8.1'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: always
        ports:
            - '8002:8000'
        environment:
            CONTAINER_ROLE: 'app'
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
    redis:
        image: 'redis:alpine'
        command: redis-server --appendonly yes --replica-read-only no
        restart: always
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
        driver_opts:
            com.docker.network.driver.mtu: 1400
volumes:
    sail-redis:
        driver: local
